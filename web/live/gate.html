<!doctype html><html><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>NIMverse live gate</title></head><body style="background:#060a18;color:#cde;font:16px monospace"><h1>NIMverse · offline life worker feasibility</h1><pre id="result">Loading bundled Python + NumPy + SciPy…</pre><script>
const w=new Worker('worker.js',{type:'module'});let serial=0, pending=new Map();w.onmessage=({data:d})=>{let p=pending.get(d.id);pending.delete(d.id);d.error?p[1](new Error(d.error)):p[0](d.value)};window.rpc=(op,args={})=>new Promise((a,b)=>{const id=++serial;pending.set(id,[a,b]);w.postMessage({id,op,...args})});
(async()=>{try{const boot=await rpc('boot');const s=await(await fetch('seed4.json')).json();await rpc('create',{spec:s});let tick=await rpc('tick',{key:s.id,n:5});window.gate={boot,tick};document.querySelector('#result').textContent=JSON.stringify(window.gate,null,2)}catch(e){document.querySelector('#result').textContent=String(e);window.gateError=String(e)}})();
</script></body></html>
